<div id="cv"
 data-si="{{sheet-id}}"
 data-pn="{{product-name}}"
 data-pp="{{product-price}}"
 data-sp="{{subscription-price}}"
 data-pc="{{product-capacity}}"
 data-pt="{{product-target}}"
 data-pi="{{product-ingredients}}"
 data-im="{{product-image}}"
 data-dg="{{dog-image}}"
 data-pu="{{purchase-url}}"
 data-su="{{subscription-url}}"
 data-sa="{{senior-age}}"
 data-kg="{{kg-per-stick}}"
 data-dr="{{discount-rate}}">
  <svg aria-hidden="true" style="display:none">
    <symbol id="cv-i-male" viewBox="0 0 24 24"><circle cx="9" cy="15" r="5"/><path d="m13 11 7-7m-5 0h5v5"/></symbol>
    <symbol id="cv-i-female" viewBox="0 0 24 24"><circle cx="12" cy="9" r="5"/><path d="M12 14v7m-3-3h6"/></symbol>
  </svg>
  <style>
    .cv-icon-joint { --i: url("{{icon-joint}}"); }
    .cv-icon-eye { --i: url("{{icon-eye}}"); }
    .cv-icon-heart { --i: url("{{icon-heart}}"); }
    .cv-icon-skin { --i: url("{{icon-skin}}"); }
    .cv-icon-liver { --i: url("{{icon-liver}}"); }
    .cv-icon-energy { --i: url("{{icon-energy}}"); }
    .cv-icon-daily { --i: url("{{icon-daily}}"); }
    #cv.cv-loading-mode {
      grid-template-rows: minmax(0, 1fr);
    }
    #cv.cv-loading-mode > .cv-head,
    #cv.cv-loading-mode > .cv-progress {
      display: none;
    }
    #cv.cv-loading-mode #cv-view {
      display: grid;
      min-height: 0;
      overflow: hidden;
      place-items: center;
    }
    #cv .cv-loading {
      width: 100%;
      padding: 32px 24px;
      text-align: center;
    }
    #cv .cv-loading-dog {
      display: block;
      width: 210px;
      height: 210px;
      margin: 0 auto 24px;
      object-fit: contain;
    }
    #cv .cv-loading h1 {
      margin: 0 auto 28px;
      font-size: 24px;
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: -.035em;
    }
    #cv .cv-loading h1 b { color: var(--red); }
    #cv .cv-stage-track {
      width: min(100%, 300px);
      height: 12px;
      margin: 0 auto 18px;
      overflow: hidden;
      border-radius: 999px;
      background: #e8ebee;
    }
    #cv .cv-stage-fill {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--red);
      animation: cv-stage-fill 3.2s linear forwards;
    }
    #cv .cv-loading-status {
      position: relative;
      height: 24px;
      color: var(--muted);
      font-size: 15px;
    }
    #cv .cv-loading-status span {
      position: absolute;
      inset: 0;
      opacity: 0;
      animation: cv-status-stage 3.2s steps(1, end) forwards;
    }
    #cv .cv-loading-status span:nth-child(2) { animation-delay: 1.05s; }
    #cv .cv-loading-status span:nth-child(3) { animation-delay: 2.1s; }
    @keyframes cv-status-stage {
      0%, 32.99% { opacity: 1; }
      33%, 100% { opacity: 0; }
    }
    @keyframes cv-stage-fill { to { width: 100%; } }
    @media (prefers-reduced-motion: reduce) {
      #cv .cv-loading-status span,
      #cv .cv-stage-fill { animation-duration: 1ms; }
      #cv .cv-loading-status span:last-child { opacity: 1; }
    }
  </style>
  <template id="cv-load">
    <section class="cv-loading">
      <img class="cv-loading-dog" src="{{loading-dog-gif}}" alt="" aria-hidden="true">
      <h1><b data-z></b>에게 꼭 맞는<br>영양제를 찾고 있어요</h1>
      <div class="cv-stage-track" role="progressbar" aria-label="맞춤 영양제 분석 진행 중" aria-valuemin="0" aria-valuemax="100"><i class="cv-stage-fill"></i></div>
      <p class="cv-loading-status" aria-live="polite">
        <span>건강 고민을 확인하고 있어요</span>
        <span>필요한 급여량을 계산하고 있어요</span>
        <span>추천 조합을 완성하고 있어요</span>
      </p>
    </section>
  </template>
  <template id="cv-result-template">
    <section class="cv-result">
      <header class="cv-result-top">
        <h1 data-a></h1>
        <div class="cv-badges" data-b></div>
      </header>
      <div class="cv-result-body">
        <section class="cv-result-section">
          <h2 class="cv-section-title">추천 제품</h2>
          <div class="cv-product-card">
            <div class="cv-product">
              <img class="cv-product-img" alt="">
              <div class="cv-product-copy">
                <h3 data-c></h3>
                <p class="cv-result-summary" data-d></p>
              </div>
            </div>
          </div>
          <dl class="cv-dose-grid">
            <div class="cv-dose-card"><dt>권장 하루 급여량</dt><dd><strong data-e></strong><small data-h>5kg 기준</small></dd></div>
            <div class="cv-dose-card is-emphasis"><dt>권장 구매량</dt><dd><strong><span data-g></span><span class="cv-dose-count">(<span data-f></span>)</span></strong><small data-j>30일분</small></dd></div>
          </dl>
        </section>
        <section class="cv-result-section">
          <h2 class="cv-section-title">제품 상세정보</h2>
          <dl class="cv-facts" data-k></dl>
        </section>
        <section class="cv-result-section cv-story">
          <h2 class="cv-section-title">이렇게 추천했어요</h2>
          <div class="cv-story-card" data-l></div>
        </section>
        <section class="cv-result-section cv-buy">
          <h2 class="cv-section-title">제품 구매</h2>
          <div class="cv-buy-grid">
            <a class="cv-buy-card" data-m target="_blank" rel="noopener">
              <span class="cv-select-mark" aria-hidden="true"></span>
              <span class="cv-buy-copy"><b>1회 구매</b><small data-p></small></span>
              <span class="cv-buy-price"><strong data-q></strong><small data-r></small></span>
            </a>
            <a class="cv-buy-card is-active" data-o target="_blank" rel="noopener">
              <span class="cv-select-mark" aria-hidden="true">✓</span>
              <span class="cv-buy-copy"><span class="cv-buy-tags"><i>인기</i><i data-s></i></span><b>정기구독</b><small data-t></small></span>
              <span class="cv-buy-price"><del data-u></del><strong data-v></strong><small data-w></small></span>
            </a>
          </div>
        </section>
        <div class="cv-result-notes">
          <p>실제 수량 옵션과 판매가는 각 상품 페이지에서 확인해 주세요.</p>
          <p>본 결과는 영양 관리 참고용이며 치료나 질병 예방을 위한 진단이 아닙니다.</p>
        </div>
        <button class="cv-restart" type="button">설문 다시 하기</button>
      </div>
    </section>
  </template>
  <header class="cv-head">
    <div><b>CANIVON</b><span>맞춤 영양 설계</span></div>
    <button type="button" id="cv-reset" hidden>처음부터</button>
  </header>
  <div class="cv-progress" aria-label="설문 진행률">
    <div class="cv-progress-row">
      <button class="cv-progress-back" id="cv-progress-back" type="button" aria-label="이전 질문으로 이동" hidden></button>
      <div class="cv-track"><i id="cv-bar"></i><img id="cv-dog" src="{{dog-image}}" alt="" /></div>
      <span id="cv-count">1 / 8</span>
    </div>
    <span class="cv-progress-label" id="cv-label">이름</span>
  </div>
  <div id="cv-view" aria-live="polite"></div>
</div>
